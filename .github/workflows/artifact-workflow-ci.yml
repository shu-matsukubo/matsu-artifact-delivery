name: Artifact workflow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-workflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit_targets: ${{ steps.select.outputs.unit_targets }}
      e2e_targets: ${{ steps.select.outputs.e2e_targets }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Classify the complete Git diff
        id: select
        run: node scripts/select-tests.mjs

  unit:
    name: Unit / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [changes]
    # Missing classification runs all targets; the quality gate still reports the failure.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit_targets != '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.matrix || '{"include":[{"os":"ubuntu-latest","node":"22.19.0","primary":true},{"os":"ubuntu-latest","node":"24","primary":false},{"os":"windows-latest","node":"22.19.0","primary":false},{"os":"windows-latest","node":"24","primary":false},{"os":"macos-latest","node":"22.19.0","primary":false},{"os":"macos-latest","node":"24","primary":false}]}') }}
    env:
      # Skills run once; the other five environments validate MCP only.
      TEST_TARGETS: ${{ matrix.primary && (needs.changes.result == 'success' && needs.changes.outputs.unit_targets || '["mcp","workflow","escalation","infrastructure"]') || '["mcp"]' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/artifact-workflow/package-lock.json
      - name: Install Skill and test infrastructure dependencies
        if: env.TEST_TARGETS != '["mcp"]'
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        if: contains(fromJSON(env.TEST_TARGETS), 'mcp')
        run: npm --prefix plugins/artifact-workflow ci
      - name: Check test infrastructure formatting
        if: contains(fromJSON(env.TEST_TARGETS), 'infrastructure')
        run: npm run format:check
      - name: Check MCP types
        if: contains(fromJSON(env.TEST_TARGETS), 'mcp')
        run: npm --prefix plugins/artifact-workflow run check
      - name: Lint MCP
        if: contains(fromJSON(env.TEST_TARGETS), 'mcp')
        run: npm --prefix plugins/artifact-workflow run lint
      - name: Check MCP formatting
        if: contains(fromJSON(env.TEST_TARGETS), 'mcp')
        run: npm --prefix plugins/artifact-workflow run format:check
      - name: Run selected Unit tests
        run: npm run test:unit -- --targets-json "$TEST_TARGETS"

  e2e:
    name: E2E / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: [changes]
    # Missing classification runs all targets; the quality gate still reports the failure.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e_targets != '[]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.result == 'success' && needs.changes.outputs.matrix || '{"include":[{"os":"ubuntu-latest","node":"22.19.0","primary":true},{"os":"ubuntu-latest","node":"24","primary":false},{"os":"windows-latest","node":"22.19.0","primary":false},{"os":"windows-latest","node":"24","primary":false},{"os":"macos-latest","node":"22.19.0","primary":false},{"os":"macos-latest","node":"24","primary":false}]}') }}
    env:
      # Skills run once; the other five environments validate MCP only.
      TEST_TARGETS: ${{ matrix.primary && (needs.changes.result == 'success' && needs.changes.outputs.e2e_targets || '["mcp","workflow","escalation","integration"]') || '["mcp"]' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/artifact-workflow/package-lock.json
      - name: Install Skill and test infrastructure dependencies
        if: env.TEST_TARGETS != '["mcp"]'
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        if: contains(fromJSON(env.TEST_TARGETS), 'mcp')
        run: npm --prefix plugins/artifact-workflow ci
      - name: Run selected E2E tests
        run: npm run test:e2e -- --targets-json "$TEST_TARGETS"

  required:
    name: Quality gate
    needs: [changes, unit, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: Require successful results for every selected test layer
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/check-ci.mjs
